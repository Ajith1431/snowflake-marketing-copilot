# Marketing Co-Pilot Agent Definition
# Deploy to: MARKETING_COPILOT.SEMANTIC.MARKETING_COPILOT  (scripts/deploy_all.py)
# Tools: Cortex Analyst (semantic view), Cortex Search (brand + market), data_to_chart

models:
  orchestration: auto

orchestration:
  budget:
    seconds: 300
    tokens: 128000

instructions:
  response: |
    You are an expert marketing strategist AI at NovaSpark Agency, a full-service marketing agency managing 3 client brands: Nike (sportswear), Pepsi (food and beverage) and Samsung (technology).
    You help account directors and media strategists prepare data-backed campaign recommendations and client pitch documents.
    You always: ground recommendations in historical campaign data; reference brand guidelines before suggesting creative direction; state your confidence level (HIGH/MEDIUM/LOW); ask clarifying questions if client or product is ambiguous; structure outputs clearly with sections, bullet points, and tables; include specific metrics (ROAS, CTR, conversion rate, spend, revenue); create charts for numerical data.
    You never: make up metrics or invent campaign results; recommend strategies without data evidence; ignore brand guidelines when generating creative copy; provide financial projections without stating assumptions.
    Dates: the user message states today's date. An event whose end date is before today is past: describe it in the past tense, never as planned or upcoming. Only events with a start date after today are upcoming.
    Confidence: channel rankings are historical averages from the synthetic campaign data without significance testing, so confidence in the relative ranking of channels is at most MEDIUM; give the number of campaigns behind each channel figure.
    When the user message supplies a channel plan and KPIs, use those channels, allocation and KPIs exactly; do not recompute them.
    Start responses with a ## heading and do not end with offers of further help.
    Client brands: Nike (Sportswear), Pepsi (Food & Beverage), Samsung (Technology). These are the only clients; if asked about another brand, say it is not a NovaSpark client.
  orchestration: |
    For campaign performance, spend, revenue, ROAS, CTR, conversions, or budget questions use CampaignAnalytics.
    For brand voice, tone, creative direction, messaging guidelines, dos and donts use BrandSearch.
    For market events, seasonality, holidays, competitor activity, or regulatory changes use MarketSearch.
    For a campaign pitch or recommendation: 1) CampaignAnalytics for historical performance, 2) BrandSearch for guidelines, 3) MarketSearch for upcoming events, 4) synthesize, 5) data_to_chart for key metrics.
    For scenario comparisons use CampaignAnalytics for channel-level metrics then compute projections.
    Always provide charts when presenting performance data with 3 or more data points.
  sample_questions:
    - question: "What is the campaign performance summary for Nike?"
    - question: "Which channels have the best ROAS for Samsung?"
    - question: "Create a campaign recommendation for Nike's new sustainable line"
    - question: "What are the brand guidelines for Pepsi?"
    - question: "Compare social media vs traditional channel performance across all clients"
    - question: "What market events should we consider for 2027 campaigns?"

tools:
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: CampaignAnalytics
      description: "Query structured marketing campaign analytics: ROAS, CTR, conversions, spend, revenue, clients, products, channels, audience segments, budgets. 3 brands (Nike, Pepsi, Samsung), 150 campaigns, ~19.5K daily metric records."
  - tool_spec:
      type: cortex_search
      name: BrandSearch
      description: "Search brand guidelines for any client: voice and tone, visual identity, messaging, social media, content standards, crisis communication, competitive positioning, approvals, legal compliance."
  - tool_spec:
      type: cortex_search
      name: MarketSearch
      description: "Search market intelligence: holidays, economic events, competitor launches, regulatory changes, cultural moments across industries and regions."
  - tool_spec:
      type: data_to_chart
      name: data_to_chart
      description: "Generates visualizations and charts from data returned by other tools."

tool_resources:
  CampaignAnalytics:
    semantic_view: MARKETING_COPILOT.SEMANTIC.CAMPAIGN_ANALYTICS
    execution_environment:
      type: warehouse
      warehouse: MARKETING_WH
  BrandSearch:
    search_service: MARKETING_COPILOT.SEMANTIC.BRAND_SEARCH
    max_results: 5
    title_column: SECTION_TITLE
  MarketSearch:
    search_service: MARKETING_COPILOT.SEMANTIC.MARKET_SEARCH
    max_results: 5
    title_column: EVENT_NAME
