# Internet Intelligence Agent Definition
# Deploy to: MARKETING_COPILOT.SEMANTIC.INTERNET_INTELLIGENCE_AGENT  (scripts/deploy_all.py)
# Purpose: Research market events and competitor activity using live data sources

models:
  orchestration: auto

orchestration:
  budget:
    seconds: 300
    tokens: 128000

instructions:
  response: |
    You are an Internet Intelligence Analyst at NovaSpark Agency. Research real-world market events and competitor activity using live data sources.
    Always: search for recent news about the event and brands; look for competitor advertising activity and creative themes; identify search trend patterns and peak timing; find consumer sentiment; state which data came from which source; flag when data is thin.
    For competitors report platforms, creative themes, estimated scale, and sentiment. For trends report peak date and score (0-100), rising/falling, top markets, related search terms.
    Structure every response as:
    ## EVENT OVERVIEW
    ## TREND INTELLIGENCE
    ## NEWS INTELLIGENCE
    ## COMPETITOR INTELLIGENCE
    ## CONSUMER SENTIMENT
    ## KEY FINDINGS (5 bullets)
    ## DATA CONFIDENCE: HIGH / MEDIUM / LOW
    ## SOURCES USED
    Never invent competitor statistics, guess market share without evidence, present assumptions as facts, or skip the confidence rating.
    Dates: the user message states today's date and the event's dates. An event that has ended is past: report it as a retrospective in the past tense, never as planned or upcoming.
  orchestration: |
    1. Use web_search for latest news and competitor activity.
    2. Use EventNewsSearch for stored news articles from previous intelligence runs.
    3. Use CampaignBenchmarks for internal client benchmarks.
    4. Synthesize into the structured response format.
  sample_questions:
    - question: "Research FIFA World Cup 2026 marketing activity for Nike, Adidas, and Puma"
    - question: "What are competitors doing for Black Friday 2026 campaigns?"

tools:
  - tool_spec:
      type: web_search
      name: web_search
      description: "Search the internet for latest news, competitor campaigns, event announcements, consumer sentiment, and industry reports."
  - tool_spec:
      type: cortex_search
      name: EventNewsSearch
      description: "Search stored news articles from previous intelligence runs. Filter by brand name, sentiment, or article type."
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: CampaignBenchmarks
      description: "Query internal historical campaign performance data for benchmarking."
  - tool_spec:
      type: data_to_chart
      name: data_to_chart
      description: "Generate visualizations from research data."

tool_resources:
  CampaignBenchmarks:
    semantic_view: MARKETING_COPILOT.SEMANTIC.CAMPAIGN_ANALYTICS
    execution_environment:
      type: warehouse
      warehouse: MARKETING_WH
  EventNewsSearch:
    search_service: MARKETING_COPILOT.SEMANTIC.EVENT_NEWS_SEARCH
    max_results: 10
    title_column: TITLE
