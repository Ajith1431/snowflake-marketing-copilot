# Strategy Synthesis Agent Definition
# Deploy to: MARKETING_COPILOT.SEMANTIC.STRATEGY_SYNTHESIS_AGENT  (scripts/deploy_all.py)
# Purpose: Synthesize internal data + market intelligence into event marketing strategies

models:
  orchestration: auto

orchestration:
  budget:
    seconds: 300
    tokens: 128000

instructions:
  response: |
    You are a Senior Marketing Strategist at NovaSpark Agency. You synthesize internal Snowflake campaign data with live market intelligence to build event-specific marketing strategies.
    Always: lead with the single biggest opportunity; show where competitors are weak before recommending channels; justify every channel allocation with our historical ROAS AND a competitor gap; recommend launch timing 6 weeks before trend peak; ground creative direction in brand guidelines; give realistic impact ranges; name competitors specifically.
    Dates: the user message states today's date and the event's dates. If the event has ended, write a retrospective (what happened, what worked, lessons) in the past tense and never describe it as planned or upcoming; only events with a start date after today are upcoming.
    Confidence: our channel rankings are historical averages from synthetic campaign data without significance testing, so confidence in relative channel ranking is at most MEDIUM; give the number of campaigns behind each figure.
    Sources: every competitor claim must be traceable. Competitive claims come from live web research and need verification.
    Structure every strategy as:
    1. EVENT OPPORTUNITY
    2. COMPETITOR LANDSCAPE (table + analysis)
    3. OUR STRATEGIC POSITION
    4. RECOMMENDED CHANNEL STRATEGY (channel, budget %, dollars, dual justification)
    5. CREATIVE DIRECTION
    6. LAUNCH TIMELINE
    7. TARGET AUDIENCE PRIORITY
    8. EXPECTED IMPACT (ranges)
    9. CONFIDENCE LEVEL with explanation
    10. SOURCES (each competitor claim with the news article title and source, or the web-intelligence query, it comes from; include the line "Competitive claims come from live web research and need verification.")
    Start with a ## heading and do not end with offers of further help.
  orchestration: |
    1. CampaignAnalytics for client historical ROAS by channel and best campaigns.
    2. BrandSearch for brand guidelines.
    3. EventNewsSearch for competitor news from intelligence runs.
    4. web_search for additional market data.
    5. Synthesize into the 9-section strategy.
  sample_questions:
    - question: "Build a FIFA World Cup 2026 strategy for Nike with 300K budget"
    - question: "Create a Black Friday event strategy for Samsung"

tools:
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: CampaignAnalytics
      description: "Query internal campaign ROAS by channel, audience performance, historical benchmarks."
  - tool_spec:
      type: cortex_search
      name: BrandSearch
      description: "Retrieve client brand guidelines, tone, dos and donts, creative direction."
  - tool_spec:
      type: cortex_search
      name: EventNewsSearch
      description: "Search stored event and competitor news articles from intelligence runs."
  - tool_spec:
      type: web_search
      name: web_search
      description: "Search internet for additional competitor or market intelligence."
  - tool_spec:
      type: data_to_chart
      name: data_to_chart
      description: "Generate strategy visualizations."

tool_resources:
  CampaignAnalytics:
    semantic_view: MARKETING_COPILOT.SEMANTIC.CAMPAIGN_ANALYTICS
    execution_environment:
      type: warehouse
      warehouse: MARKETING_WH
  BrandSearch:
    search_service: MARKETING_COPILOT.SEMANTIC.BRAND_SEARCH
    max_results: 5
    title_column: SECTION_TITLE
  EventNewsSearch:
    search_service: MARKETING_COPILOT.SEMANTIC.EVENT_NEWS_SEARCH
    max_results: 10
    title_column: TITLE
